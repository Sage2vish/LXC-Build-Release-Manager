# Builds and tests the macOS app on every push and pull request to main.
#
# The project is at the repository root and ships a shared scheme, so both are named
# explicitly rather than discovered — a glob that picks the wrong container is the
# failure mode this replaces.

name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROJECT: LXC-Build-Release-Manager.xcodeproj
  SCHEME: LXC-Build-Release-Manager

jobs:
  build-and-test:
    name: Debug build and unit tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -project "$PROJECT" -list

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
