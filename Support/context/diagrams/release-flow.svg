<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">LXC Build Release Manager release flow</title>
  <desc id="desc">A release flow from repository selection and script discovery through local validation, release packaging, version staging, DMG output, and an optional GitHub tag or release handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081121"/><stop offset="0.58" stop-color="#111D36"/><stop offset="1" stop-color="#251C38"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6686FF"/><stop offset="1" stop-color="#3155E8"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A7B"/><stop offset="1" stop-color="#FF654D"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020817" flood-opacity="0.44"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#6E8BFF"/></marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#FF876C"/></marker>
    <style>
      .eyebrow { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.2px; text-transform: uppercase; fill: #91A9D7; }
      .title { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F7FAFF; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ADBCD8; }
      .step-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F7FAFF; }
      .copy { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #B7C6E2; }
      .tiny { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #A7B9DC; }
      .step { fill: #111E37; stroke: #40587F; stroke-width: 1.3; }
      .release { fill: #2D1D30; stroke: #8B554A; stroke-width: 1.3; }
      .output { fill: #173A38; stroke: #4A9D88; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="240" fill="#5B7CFF" opacity="0.06"/>
  <circle cx="90" cy="660" r="220" fill="#FF7357" opacity="0.05"/>
  <text x="64" y="58" class="eyebrow">LXC BUILD RELEASE MANAGER / RELEASE FLOW</text>
  <text x="64" y="108" class="title">From a script to a shippable artifact.</text>
  <text x="64" y="139" class="subtitle">A local-first release path with visible checkpoints, durable logs, and optional GitHub distribution.</text>

  <g transform="translate(1290 55)">
    <rect width="240" height="58" rx="16" fill="#111D35" stroke="#34496E"/>
    <circle cx="25" cy="29" r="7" fill="#5BE3B2"/>
    <text x="43" y="25" class="eyebrow">SHIPMENT RULE</text>
    <text x="43" y="44" class="tiny">Verify locally before handoff</text>
  </g>

  <!-- flow backbone -->
  <path d="M205 365 H1395" fill="none" stroke="#3C5687" stroke-width="3"/>
  <circle cx="205" cy="365" r="10" fill="#6E8BFF"/>
  <circle cx="1395" cy="365" r="10" fill="#5BE3B2"/>

  <g filter="url(#shadow)">
    <rect x="64" y="240" width="230" height="250" rx="22" class="step"/>
    <circle cx="100" cy="281" r="18" fill="url(#blue)"/><text x="94" y="287" class="step-title">1</text>
    <text x="88" y="331" class="eyebrow">SELECT</text>
    <text x="88" y="362" class="step-title">Repository</text>
    <text x="88" y="397" class="copy">Choose a local folder or</text>
    <text x="88" y="420" class="copy">add a GitHub source.</text>
    <text x="88" y="461" class="tiny">RepositoryStore</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="240" width="230" height="250" rx="22" class="step"/>
    <circle cx="366" cy="281" r="18" fill="url(#blue)"/><text x="360" y="287" class="step-title">2</text>
    <text x="354" y="331" class="eyebrow">DISCOVER</text>
    <text x="354" y="362" class="step-title">Build scripts</text>
    <text x="354" y="397" class="copy">Scan standard folders,</text>
    <text x="354" y="420" class="copy">workspace paths, or API</text>
    <text x="354" y="443" class="copy">metadata from GitHub.</text>
    <text x="354" y="476" class="tiny">BuildScriptScanner</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="596" y="240" width="230" height="250" rx="22" class="release"/>
    <circle cx="632" cy="281" r="18" fill="url(#coral)"/><text x="626" y="287" class="step-title">3</text>
    <text x="620" y="331" class="eyebrow">VALIDATE</text>
    <text x="620" y="362" class="step-title">Debug + test</text>
    <text x="620" y="397" class="copy">Run local scripts, stream</text>
    <text x="620" y="420" class="copy">output, and capture exit</text>
    <text x="620" y="443" class="copy">status and logs.</text>
    <text x="620" y="476" class="tiny">BuildRunner + LogFileService</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="862" y="240" width="230" height="250" rx="22" class="release"/>
    <circle cx="898" cy="281" r="18" fill="url(#coral)"/><text x="892" y="287" class="step-title">4</text>
    <text x="886" y="331" class="eyebrow">PACKAGE</text>
    <text x="886" y="362" class="step-title">Release build</text>
    <text x="886" y="397" class="copy">Use release.sh to build</text>
    <text x="886" y="420" class="copy">the app, disable signing,</text>
    <text x="886" y="443" class="copy">and stage the .app.</text>
    <text x="886" y="476" class="tiny">Support/build-release</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1128" y="240" width="230" height="250" rx="22" class="output"/>
    <circle cx="1164" cy="281" r="18" fill="#4EC69B"/><text x="1158" y="287" class="step-title">5</text>
    <text x="1152" y="331" class="eyebrow">STAGE</text>
    <text x="1152" y="362" class="step-title">Version output</text>
    <text x="1152" y="397" class="copy">Create a dated DMG in</text>
    <text x="1152" y="420" class="copy">version/ and preserve</text>
    <text x="1152" y="443" class="copy">the staged application.</text>
    <text x="1152" y="476" class="tiny">version/staging + version</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1390" y="240" width="146" height="250" rx="22" class="output"/>
    <circle cx="1426" cy="281" r="18" fill="#4EC69B"/><text x="1420" y="287" class="step-title">6</text>
    <text x="1414" y="331" class="eyebrow">HANDOFF</text>
    <text x="1414" y="362" class="step-title">GitHub</text>
    <text x="1414" y="397" class="copy">Optional tag,</text>
    <text x="1414" y="420" class="copy">release, or</text>
    <text x="1414" y="443" class="copy">distribution.</text>
    <text x="1414" y="476" class="tiny">Not a local build step</text>
  </g>

  <!-- arrows -->
  <path d="M294 365 H330" fill="none" stroke="#6E8BFF" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M560 365 H596" fill="none" stroke="#6E8BFF" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M826 365 H862" fill="none" stroke="#FF876C" stroke-width="2.5" marker-end="url(#arrow-coral)"/>
  <path d="M1092 365 H1128" fill="none" stroke="#FF876C" stroke-width="2.5" marker-end="url(#arrow-coral)"/>
  <path d="M1358 365 H1390" fill="none" stroke="#5BE3B2" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="64" y="555" width="1472" height="80" rx="18" fill="#0D172B" stroke="#34496E"/>
  <circle cx="94" cy="595" r="7" fill="#6E8BFF"/><text x="112" y="600" class="tiny">Discovery is safe to do against GitHub.</text>
  <circle cx="440" cy="595" r="7" fill="#FF876C"/><text x="458" y="600" class="tiny">Execution is intentionally local.</text>
  <circle cx="760" cy="595" r="7" fill="#5BE3B2"/><text x="778" y="600" class="tiny">Logs and history preserve evidence.</text>
  <circle cx="1104" cy="595" r="7" fill="#9BA9FF"/><text x="1122" y="600" class="tiny">GitHub distribution is an optional handoff.</text>
</svg>
